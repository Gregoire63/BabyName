<!--
  Ce que voit l'ecran AVANT que Vue ne demarre : le logo qui s'ecrit a la main,
  puis ses deux etoiles (cinq branches) qui s'allument (meme animation que marketing/logo).

  L'app est une SPA (ssr: false) : sans ce fragment, un ecran blanc entre le
  premier octet et le premier rendu. Nuxt l'injecte dans la coquille et retire
  son conteneur des que l'app est montee (app:suspense:resolve) — d'un coup.
  Le script ci-dessous sort donc l'ecran de ce conteneur et le garde jusqu'a
  ce que le plugin amorce.client.ts dise que l'app est prete ; il s'efface
  alors en fondu.

  Dans l'app des stores, le trait ne part qu'au retrait de l'ecran natif
  (voir le script).

  Le logo s'ecrit en entier une fois par jour (la premiere ouverture) : l'app
  attend la fin du trait (2,3 s au plus, fondu compris) plutot que de le couper au milieu.
  Les autres ouvertures du jour, il est deja dessine et disparait des que
  l'app est prete : on ne fait pas attendre pour une animation deja vue.

  Le <style> est DANS .amorce : il part avec lui quand Nuxt retire son
  conteneur. Tout est en ligne et les couleurs sont en dur : aucune feuille de style
  n'est encore chargee, donc pas de variables CSS. Trace : pathLength=1000.
-->
